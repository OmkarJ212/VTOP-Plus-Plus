<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VTOP++</title>
  <link rel="stylesheet" href="../content/styles/themes.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-left">
        <img src="../../icons/icon48.png" alt="VTOP++ Logo" class="header-logo">
        <div class="header-text">
          <div class="title-row">
            <h1>VTOP++</h1>
          </div>
        </div>
      </div>
      <div class="status-badge" id="vtop-status-badge">● Active</div>
    </header>

    <label class="session-card" for="toggle-session">
      <div class="session-top">
        <div class="session-info">
          <div class="session-icon-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <div class="session-copy">
            <strong>Session Keep-Alive</strong>
            <small>Prevents 15-minute idle logout</small>
          </div>
        </div>
        <span class="switch-wrap">
          <input type="checkbox" id="toggle-session" checked>
          <span class="slider"></span>
        </span>
      </div>
      <div class="session-meta" id="session-meta-text">
        <span class="session-dot"></span>
        <span>Active</span>
      </div>
    </label>
  </div>

  <script src="../utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
