<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VTOP++ Control Center</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="header-left">
        <img src="../../icons/icon48.png" alt="VTOP++ Logo" class="header-logo">
        <div>
          <div class="title-row">
            <h1>VTOP++</h1>
            <span class="version-tag">v1.0.0</span>
          </div>
          <div class="subtitle">VIT Vellore VTOP Companion</div>
        </div>
      </div>
      <div class="status-badge" id="vtop-status-badge">● Active</div>
    </div>

    <!-- Quick Action Bar -->
    <div class="quick-actions">
      <button class="action-btn" id="btn-scan-downloader">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Downloader</span>
      </button>
      <button class="action-btn" id="btn-trigger-spotlight">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search Pages</span>
      </button>
      <button class="action-btn" id="btn-toggle-privacy">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>Privacy Blur</span>
      </button>
      <button class="action-btn" id="btn-toggle-dark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span>Dark Mode</span>
      </button>
    </div>

    <div class="status-message" id="popup-status-msg"></div>

    <!-- Feature Toggles Section -->
    <div class="section-title">Features</div>
    <div class="toggles-list">
      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#0f172a;color:#38bdf8;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </div>
          <span class="toggle-label">
            <strong>Universal Dark Mode</strong>
            <small>Dark theme for all VTOP pages</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-dark-mode">
        <span class="slider"></span>
      </label>
      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#e0f2fe;color:#0284c7;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          </div>
          <span class="toggle-label">
            <strong>Material Downloader</strong>
            <small>Safe teacher-specific ZIP downloads</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-downloader" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#f0fdf4;color:#16a34a;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
          </div>
          <span class="toggle-label">
            <strong>Live Course Filter</strong>
            <small>Instant search & teacher filtering</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-filter" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#e0e7ff;color:#4f46e5;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <span class="toggle-label">
            <strong>Search Pages (Ctrl+K)</strong>
            <small>Fast search bar for all VTOP pages</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-spotlight" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#fef3c7;color:#d97706;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          </div>
          <span class="toggle-label">
            <strong>Bunk Calculator</strong>
            <small>75%/80% target bunks & debarred alerts</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-attendance" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#fae8ff;color:#a855f7;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
          </div>
          <span class="toggle-label">
            <strong>FAT Marks Predictor</strong>
            <small>Predicts required FAT marks for S/A grades</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-fat" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#fee2e2;color:#dc2626;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
          </div>
          <span class="toggle-label">
            <strong>DA Deadline Tracker</strong>
            <small>Assignment due date countdowns</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-da" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#fef9c3;color:#ca8a04;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          </div>
          <span class="toggle-label">
            <strong>Auto-Captcha & Login Helper</strong>
            <small>Auto-focus & auto-uppercase captcha</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-captcha" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#f1f5f9;color:#475569;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </div>
          <span class="toggle-label">
            <strong>Session Keep-Alive</strong>
            <small>Prevents 15-minute idle timeout</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-session" checked>
        <span class="slider"></span>
      </label>

      <label class="toggle-item">
        <div class="toggle-left">
          <div class="toggle-icon-wrap" style="background:#ccfbf1;color:#0d9488;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="15" x2="21" y2="15"></line></svg>
          </div>
          <span class="toggle-label">
            <strong>Floating Quick Dock</strong>
            <small>Pinned corner access bar</small>
          </span>
        </div>
        <input type="checkbox" id="toggle-dock" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="popup-footer">
      For VIT Vellore (vtop.vit.ac.in)
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
